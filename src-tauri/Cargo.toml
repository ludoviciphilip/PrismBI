[package]
name = "prismbi"
version = "0.2.0"
description = "PrismBI — Native Linux Business Intelligence powered by Rust & DuckDB"
authors = ["Luis Felipe de Almeida Vieira"]
edition = "2021"

[lib]
name = "prismbi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1", features = ["bundled"] }
calamine = "0.38"
zip = "2"
encoding_rs = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
