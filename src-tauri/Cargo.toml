[package]
name = "prismbi"
version = "0.9.1"
description = "PrismBI — Native Business Intelligence powered by Rust & DuckDB (Linux & Windows)"
authors = ["Luis Felipe de Almeida Vieira"]
edition = "2021"

[lib]
name = "prismbi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1", features = ["bundled", "parquet", "json"] }
calamine = "0.38"
zip = "2"
encoding_rs = "0.8"
walkdir = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

# Debuginfo completo de DuckDB/arrow/gtk gerava ~4 GB por build de debug
# (libprismbi_lib.a + .so) e o target/ chegou a 107 GB. Só tabelas de linha
# para o crate do app (backtraces úteis) e nada para dependências.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
