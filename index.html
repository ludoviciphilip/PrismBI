<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrismBI — Native Linux Business Intelligence</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="description" content="Aplicação nativa Linux de Business Intelligence estilo Power BI com motor DuckDB nativo em Rust, modelagem semântica DAX e compatibilidade .pbip/.pbix." />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('insighthub_theme_mode') || 'light';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f0f2f5] dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-400 selection:text-slate-900 font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
