name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage, .deb, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - name: Install frontend dependencies & run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --test dax_corpus

      - name: Build Tauri bundles (AppImage, deb, rpm)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles appimage,deb,rpm

      # O WebKitGTK embutido (Ubuntu 22.04) é antigo e deixa o canvas lento em
      # distros atuais: o hook faz o AppImage usar o webkit2gtk-4.1 do sistema
      # quando compatível (fallback automático para o embutido).
      - name: Post-process AppImage (system WebKitGTK hook)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            APPIMAGE_EXTRACT_AND_RUN=1 scripts/appimage-postprocess.sh "$f" "$RUNNER_TEMP/appimagetool"
            # Sanidade: o hook precisa estar dentro do AppImage final.
            (cd "$RUNNER_TEMP" && rm -rf squashfs-root && APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$f" --appimage-extract AppRun >/dev/null && grep -q 00-prismbi-system-webkit.sh squashfs-root/AppRun)
          done

      - name: Collect release artifacts & generate SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets

      # O updater do app (src-tauri/src/updater.rs) só instala se
      # SHA256SUMS.txt tiver assinatura Ed25519 válida da chave oficial.
      # Sem o secret a release falha aqui, em vez de publicar sem assinatura.
      - name: Sign SHA256SUMS.txt (Ed25519)
        env:
          PRISMBI_UPDATE_SIGNING_KEY: ${{ secrets.PRISMBI_UPDATE_SIGNING_KEY }}
          EXPECTED_PUBKEY_HEX: efbc7fdbf5234578df4e71300a8e6d16fc6f518b075e6357c4c2b4ee17a2a3f6
        run: |
          if [ -z "$PRISMBI_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Secret PRISMBI_UPDATE_SIGNING_KEY ausente: releases sem assinatura não são instaláveis pelo updater."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-signing.pem"
          printf '%s\n' "$PRISMBI_UPDATE_SIGNING_KEY" > "$key"
          actual=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if [ "$actual" != "$EXPECTED_PUBKEY_HEX" ]; then
            echo "::error::A chave do secret não corresponde à chave pública embutida no app."
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in release-assets/SHA256SUMS.txt -out release-assets/SHA256SUMS.txt.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in release-assets/SHA256SUMS.txt -sigfile release-assets/SHA256SUMS.txt.sig
          rm -f "$key"

      - name: Release notes (docs/release-notes/<tag>.md when present)
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "" > "$RUNNER_TEMP/empty.md"; echo "path=$RUNNER_TEMP/empty.md" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
