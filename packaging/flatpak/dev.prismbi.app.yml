app-id: dev.prismbi.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: prismbi
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home
modules:
  - name: prismbi
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
    build-commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm tauri build --bundles deb
      - install -Dm755 src-tauri/target/release/prismbi /app/bin/prismbi
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.prismbi.app.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.prismbi.app.png
    sources:
      - type: git
        url: https://github.com/ludoviciphilip/PrismBI.git
        tag: v0.7.0
